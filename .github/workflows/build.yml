name: CAD model and photo silhouette QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install OpenSCAD and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openscad xvfb fonts-dejavu-core
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate STEP/STL, PNG renders, and QA metrics
        run: bash scripts/build.sh
      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spray-bottle-cad
          path: out/
          retention-days: 30
